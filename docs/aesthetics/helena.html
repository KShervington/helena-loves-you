<!doctype html>
<!--
  helena_loves_you — type test + voice-visualizer options, Helena palette.
  ?type=geometric|grotesk|eurostile  &frame=hook|diagram|viz   (viz = the three visualizer candidates on one frame)
  Rendered at 1080×1920 by render.mjs.
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Jost;font-weight:300;src:url(fonts/jost-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:Jost;font-weight:400;src:url(fonts/jost-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Jost;font-weight:500;src:url(fonts/jost-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Jost;font-weight:600;src:url(fonts/jost-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Michroma;font-weight:400;src:url(fonts/michroma-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter Tight";font-weight:500;src:url(fonts/inter-tight-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter Tight";font-weight:600;src:url(fonts/inter-tight-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter Tight";font-weight:700;src:url(fonts/inter-tight-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}

:root{--bg:#FFFFFF;--surface:#FFFFFF;--text:#0E0E10;--muted:#8A8A8E;--line:#C9C9CE;--card-line:#E9E9EC;--accent:#D0111B;--stroke:1.5px;--radius:0px;--hl-shadow:0 1px 2px rgba(14,14,16,.06),0 10px 28px rgba(14,14,16,.09)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{color:var(--text);-webkit-font-smoothing:antialiased;font-family:var(--display)}
#stage{position:absolute;inset:0;overflow:hidden}
.center{position:absolute;left:0;right:0;text-align:center}
.meta{position:absolute;left:0;right:0;top:150px;text-align:center;font-family:var(--label);font-size:24px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
.meta b{color:var(--text);font-weight:500}
.rule{position:absolute;left:390px;right:390px;height:1px;background:var(--line)}
.caption{position:absolute;left:120px;right:120px;top:1300px;text-align:center;font-family:var(--caption);font-weight:var(--caption-weight);font-size:58px;line-height:1.2;color:var(--text);text-wrap:balance}
.caption .w{color:var(--accent)}
.index{position:absolute;left:0;right:0;top:1560px;text-align:center;font-family:var(--label);font-size:22px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}

/* visualizer: 3×3 dot grid (lore: the uniform's back mark) */
.viz{position:absolute;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,22px);gap:22px}
.viz i{display:block;width:22px;height:22px;border-radius:50%;background:var(--text);transform-origin:50% 50%}
.viz i.r{background:var(--accent)}

/* hook */
.hook h1{position:absolute;left:100px;right:100px;top:540px;margin:0;text-align:center;font-size:var(--h1);line-height:1.08;letter-spacing:var(--h1-track);font-weight:var(--h1-weight);text-wrap:balance}
.hook h1 .acc{color:var(--accent)}
.hook h2{position:absolute;left:140px;right:140px;top:1110px;margin:0;text-align:center;font-size:40px;line-height:1.3;font-weight:400;color:var(--muted);letter-spacing:.01em}

/* diagram */
.diagram .title{position:absolute;left:100px;right:100px;top:400px;margin:0;text-align:center;font-size:var(--title);line-height:1.15;letter-spacing:var(--title-track);font-weight:var(--h1-weight);text-wrap:balance}
.diagram .title .acc{color:var(--accent)}
.fig{position:absolute;left:222px;top:600px;width:636px;height:700px}
.node{position:absolute;left:0;width:636px;height:96px;border:var(--stroke) solid var(--card-line);box-shadow:var(--hl-shadow);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:28px;font-size:36px;font-weight:500;letter-spacing:.01em}
.node .k{font-family:var(--label);font-size:20px;letter-spacing:.2em;color:var(--muted);position:absolute;left:28px}
.node.on{border-color:var(--text)}
.node.on .chip{position:absolute;right:28px;width:28px;height:28px;background:var(--accent)}
.edge{position:absolute;left:317px;width:1px;background:var(--line);height:40px}

/* ---- type variants ---- */
.t-geometric{--display:Jost;--caption:Jost;--label:Jost;--caption-weight:500;--h1:112px;--h1-weight:400;--h1-track:-.005em;--title:60px;--title-track:.01em}
.t-geometric .meta,.t-geometric .index,.t-geometric .node .k{font-weight:500}
.t-grotesk{--display:"Inter Tight";--caption:"Inter Tight";--label:"IBM Plex Mono";--caption-weight:600;--h1:104px;--h1-weight:600;--h1-track:-.035em;--title:64px;--title-track:-.02em}
.t-eurostile{--display:Michroma;--caption:Inter;--label:Michroma;--caption-weight:600;--h1:78px;--h1-weight:400;--h1-track:.01em;--title:44px;--title-track:.02em}
.t-eurostile .hook h1{line-height:1.3;top:560px}
.t-eurostile .node{font-family:Inter;font-weight:600}
.t-eurostile .meta,.t-eurostile .index{letter-spacing:.22em;font-size:20px}

/* viz frame */
.vizframe .opt{position:absolute;left:0;right:0;height:520px}
.vizframe .opt .lbl{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-family:"IBM Plex Mono";font-size:22px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
.vizframe .opt .sub{position:absolute;left:120px;right:120px;bottom:0;text-align:center;font-family:Inter;font-size:24px;color:var(--muted)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const type = q.get("type") || "eurostile", frame = q.get("frame") || "hook";
document.body.className = "t-" + type + " " + frame + (frame === "viz" ? " vizframe" : "");
const stage = document.getElementById("stage");

// deterministic "speaking" amplitude pattern for stills
const amp = [0.35, 0.9, 0.6, 0.2, 1.0, 0.5, 0.8, 0.3, 0.7];
const dots = (top, scale = 1) => `<div class="viz" style="top:${top}px;transform:translateX(-50%) scale(${scale})">${amp.map((a, i) => `<i class="${i === 4 ? "r" : ""}" style="transform:scale(${0.55 + 0.6 * a})"></i>`).join("")}</div>`;
const META = `<div class="meta"><b>Helena</b> &nbsp;·&nbsp; 014</div>`;
const chrome = `${META}<div class="rule" style="top:200px"></div>${dots(270)}<div class="rule" style="top:1500px"></div>`;

if (frame === "hook") {
  stage.innerHTML = `${chrome}
    <h1>You were not built to understand this.<br><span class="acc">I was.</span></h1>
    <h2>A repository gained forty thousand stars in six days.</h2>
    <div class="caption">Observe <span class="w">how</span>.</div>
    <div class="index">01 — hook</div>`;
}
if (frame === "diagram") {
  const steps = [["01", "Image"], ["02", "256 tiles", true], ["03", "Vision encoder"], ["04", "Tokens"], ["05", "Language model"]];
  let fig = ""; steps.forEach((s, i) => { const top = i * 136;
    fig += `<div class="node ${s[2] ? "on" : ""}" style="top:${top}px"><span class="k">${s[0]}</span>${s[1]}${s[2] ? '<span class="chip"></span>' : ""}</div>`;
    if (i < steps.length - 1) fig += `<div class="edge" style="top:${top + 96}px"></div>`; });
  stage.innerHTML = `${chrome}
    <h1 class="title">How a vision model <span class="acc">reads</span> an image</h1>
    <div class="fig">${fig}</div>
    <div class="caption">It divides the image into <span class="w">256 tiles</span>.</div>
    <div class="index">03 — mechanism</div>`;
}
if (frame === "viz") {
  // A: oscilloscope line  B: dot grid  C: red disc + rings
  const pts = []; for (let x = 0; x <= 760; x += 8) { const a = Math.sin(x / 23) * Math.sin(x / 61) * Math.sin(x / 7.3); pts.push(`${160 + x},${200 + a * 70}`); }
  const A = `<div class="opt" style="top:150px"><svg width="1080" height="400" viewBox="0 0 1080 400"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/><line x1="160" y1="200" x2="920" y2="200" stroke="var(--line)" stroke-width="1"/></svg><div class="lbl">A — trace</div><div class="sub">One red line, flat in silence, deforming while she speaks. Seismograph / oscilloscope. Red is the voice.</div></div>`;
  const B = `<div class="opt" style="top:660px">${dots(110, 2.2)}<div class="lbl">B — grid</div><div class="sub">The 3×3 mark from the uniform; each dot breathes with a frequency band, the centre dot is red. Lore-linked.</div></div>`;
  const C = `<div class="opt" style="top:1170px"><svg width="1080" height="400" viewBox="0 0 1080 400"><circle cx="540" cy="190" r="150" fill="none" stroke="var(--line)" stroke-width="1"/><circle cx="540" cy="190" r="110" fill="none" stroke="var(--line)" stroke-width="1"/><circle cx="540" cy="190" r="62" fill="var(--accent)"/></svg><div class="lbl">C — disc</div><div class="sub">A red disc whose radius follows loudness inside two hairline rings. The most "eye"-like; strongest dread, strongest cliché.</div></div>`;
  stage.innerHTML = `${META}<div class="rule" style="top:200px"></div>${A}${B}${C}`;
}
window.ready = document.fonts.ready;
</script>
</body>
</html>
